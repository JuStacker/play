name: Run simulation every 10 minutes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Simulation
        env:
          NODE_ENV: cloud
        run: pnpm start

      - name: Generate Log Page
        run: pnpm log

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-zzz-gachaV2.txt
          git add zzzGachaV2-time-slot.json
          git add zzzGachaV2-info.txt
          git add docs/index.html
          git commit -m "Add result at $(date --iso-8601=seconds)" || echo "No changes"
          git push
