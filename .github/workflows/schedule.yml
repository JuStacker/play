name: Run simulation every 10 minutes

on:
  schedule:
    - cron: "*/5 * * * *" # 5분마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Run Simulation
        env:
          NODE_ENV: cloud
        run: node ./dist/main.js

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-zzz-gachaV2.txt
          git add zzzGachaV2-time-slot.json
          git add zzzGachaV2-info.txt
          git commit -m "Add result at $(date --iso-8601=seconds)" || echo "No changes"
          git push
