# 외부 cron-job.org에서 1분마다 workflow_dispatch 호출
# https://console.cron-job.org/jobs/8335590/history
name: 시뮬레이션 실행 및 결과 커밋

on:
  workflow_dispatch:

# 외부 cron이 1분 간격으로 호출해도 겹쳐 돌지 않게 직렬화 (동시 실행 시 같은 데이터 파일에 동시 write하면서 git merge conflict 발생했었음)
concurrency:
  group: gacha-simulation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Simulation
        env:
          NODE_ENV: cloud
        run: pnpm start

      - name: Build Time Slot
        env:
          NODE_ENV: cloud
        run: pnpm init-time-slot

      - name: Analyze And Generate Page
        env:
          NODE_ENV: cloud
        run: pnpm analyze-for-v2

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud-zzz-gachaV2.txt
          git add zzzGachaV2-time-slot.json
          git add zzzGachaV2-info.txt
          git add cloud-gf2-gacha.txt
          git add gf2-time-slot.json
          git add gf2-info.txt
          git add docs/index.html
          git commit -m "Add result at $(date --iso-8601=seconds)" || echo "No changes"
          git push
