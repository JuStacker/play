name: Run simulation every 10 minutes

on:
  schedule:
    - cron: "*/10 * * * *"  # 10분마다
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Simulation
        run: node simulation.js

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.txt
          git commit -m "Add result at $(date --iso-8601=seconds)" || echo "No changes"
          git push